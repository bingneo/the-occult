name: sciblock-occult

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    container_name: sciblock-occult-api
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: [.env]
    environment:
      PORT: "3000"
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:28333
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: sciblock-occult-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api-server

  postgres:
    image: postgres:17-alpine
    container_name: sciblock-occult-pg
    ports:
      - "${DB_PORT:-5432}:5432"
    env_file: [.env]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-17-data:/var/lib/postgresql/data
      - ./backups/00-create-role.sql:/docker-entrypoint-initdb.d/00-create-role.sql:ro
      - ./backups/database_backup.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: sciblock-occult-sfs
    entrypoint: ["/bin/sh", "/init/seaweedfs-init.sh"]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ./scripts/seaweedfs-init.sh:/init/seaweedfs-init.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-17-data:
  seaweed-data:
