kind = "web"
previewPath = "/"
title = "The Occult - 失败实验分享平台"
version = "1.0.0"
id = "artifacts/the-occult"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26119

[services.development]
run = "pnpm --filter @workspace/the-occult run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/the-occult", "run", "build" ]
publicDir = "artifacts/the-occult/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26119"
BASE_PATH = "/"
