name: sciblock-occult

services:
  api-server:
    extends:
      file: docker-compose.yml
      service: api-server
    image: ghcr.io/bingneo/sciblock-occult-api:latest
    build: !reset null

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    image: ghcr.io/bingneo/sciblock-occult-web:latest
    build: !reset null

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  seaweedfs:
    extends:
      file: docker-compose.yml
      service: seaweedfs

volumes:
  postgres-17-data:
  seaweed-data:
