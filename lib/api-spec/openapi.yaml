openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: The Occult - Failed Experiment Sharing Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: experiments
    description: Failed experiment operations
  - name: comments
    description: Comment operations
  - name: users
    description: User operations
  - name: stats
    description: Statistics and aggregates
  - name: notifications
    description: User notification operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /experiments:
    get:
      operationId: listExperiments
      tags: [experiments]
      summary: List all experiments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, mostLiked, mostCommented]
            default: newest
      responses:
        "200":
          description: List of experiments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"

    post:
      operationId: createExperiment
      tags: [experiments]
      summary: Create a new failed experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentBody"
      responses:
        "201":
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /experiments/{id}:
    get:
      operationId: getExperiment
      tags: [experiments]
      summary: Get a single experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Experiment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateExperiment
      tags: [experiments]
      summary: Update an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperimentBody"
      responses:
        "200":
          description: Updated experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteExperiment
      tags: [experiments]
      summary: Delete an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /experiments/{id}/like:
    post:
      operationId: likeExperiment
      tags: [experiments]
      summary: Toggle like on an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"

  /experiments/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get platform statistics overview
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/failure-reasons:
    get:
      operationId: getFailureReasons
      tags: [stats]
      summary: Get most common failure reasons
      responses:
        "200":
          description: Failure reason statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FailureReasonStat"

  /stats/categories:
    get:
      operationId: getCategoryStats
      tags: [stats]
      summary: Get experiment counts by category
      responses:
        "200":
          description: Category statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  /experiments/trending:
    get:
      operationId: getTrendingExperiments
      tags: [experiments]
      summary: Get trending experiments
      responses:
        "200":
          description: Trending experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"

  /users/{id}/experiments:
    get:
      operationId: getUserExperiments
      tags: [users]
      summary: Get experiments by a specific user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get current user's notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read:
    patch:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        email:
          type: ["string", "null"]
        studentId:
          type: ["string", "null"]
        researchField:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        experimentCount:
          type: integer
      required:
        - id
        - username
        - displayName
        - createdAt
        - experimentCount

    RegisterBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string
        email:
          type: ["string", "null"]
        studentId:
          type: ["string", "null"]
        researchField:
          type: ["string", "null"]
      required:
        - username
        - password
        - displayName

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message

    Experiment:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        failureReason:
          type: string
        hypothesis:
          type: ["string", "null"]
        methodology:
          type: ["string", "null"]
        lessonLearned:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        aiReport:
          type: ["string", "null"]
        imagePaths:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        videoUrls:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        likeCount:
          type: integer
        commentCount:
          type: integer
        isLiked:
          type: boolean
        authorId:
          type: integer
        authorName:
          type: string
        authorAvatar:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - category
        - failureReason
        - likeCount
        - commentCount
        - isLiked
        - authorId
        - authorName
        - createdAt
        - updatedAt

    ExperimentDetail:
      allOf:
        - $ref: "#/components/schemas/Experiment"
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
          required:
            - comments

    ExperimentListResponse:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - experiments
        - total
        - page
        - totalPages

    CreateExperimentBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        failureReason:
          type: string
        hypothesis:
          type: ["string", "null"]
        methodology:
          type: ["string", "null"]
        lessonLearned:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        aiReport:
          type: ["string", "null"]
        imagePaths:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        videoUrls:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      required:
        - title
        - description
        - category
        - failureReason

    UpdateExperimentBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        hypothesis:
          type: ["string", "null"]
        methodology:
          type: ["string", "null"]
        lessonLearned:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        aiReport:
          type: ["string", "null"]
        imagePaths:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        videoUrls:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"

    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer
      required:
        - liked
        - likeCount

    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        authorAvatar:
          type: ["string", "null"]
        experimentId:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - authorId
        - authorName
        - experimentId
        - createdAt

    CreateCommentBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    StatsOverview:
      type: object
      properties:
        totalExperiments:
          type: integer
        totalUsers:
          type: integer
        totalComments:
          type: integer
        totalLikes:
          type: integer
        mostActiveResearchField:
          type: ["string", "null"]
      required:
        - totalExperiments
        - totalUsers
        - totalComments
        - totalLikes

    FailureReasonStat:
      type: object
      properties:
        reason:
          type: string
        count:
          type: integer
      required:
        - reason
        - count

    CategoryStat:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        content:
          type: string
        experimentId:
          type: ["integer", "null"]
        commentId:
          type: ["integer", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - content
        - isRead
        - createdAt

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer
      required:
        - notifications
        - unreadCount
